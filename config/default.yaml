source:
  provider: MDIC/SECEX Comex Stat
  landing_page: https://www.gov.br/mdic/pt-br/assuntos/comercio-exterior/estatisticas/base-de-dados-bruta
  base_url: https://balanca.mdic.gov.br/balanca/bd/comexstat-bd/ncm
  export_template: EXP_{year}.csv
  import_template: IMP_{year}.csv
  encoding: latin1
  separator: ';'
  historical_start: 1997

pipeline:
  raw_dir: data/raw
  staged_dir: data/staged
  mart_dir: data/mart
  database: data/mart/comex.duckdb
  compression: zstd
