[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "brasil-comex-data"
version = "0.1.0"
description = "Pipeline reprodutível para dados de comércio exterior do Brasil"
requires-python = ">=3.10"
dependencies = [
  "duckdb>=1.0.0",
  "pandas>=2.0.0",
  "pyarrow>=14.0.0",
  "pyyaml>=6.0",
  "requests>=2.31.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0.0", "ruff>=0.6.0"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
